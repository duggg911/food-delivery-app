<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Foodie</h1>
        <p>Fresh food delivered to your doorstep</p>
    </header>

    <main>
        <h2>Today's Menu</h2>
        
        <div class="offer">
           <h2>Special Offer!</h2>
           <p>Get 10% off your first food order.</p>
        </div>

        <div class="food">
            <h3>Veg Thali</h3>
            <p>Rice, Dal, Roti, Sabzi and Salad</p>
            <p>Price: ₹120</p>
        </div>

        <div class="food">
            <h3>Paneer Biryani</h3>
            <p>Delicious paneer biryani with raita</p>
            <p>Price: ₹180</p>
        </div>
    </main>

</body>
</html>
